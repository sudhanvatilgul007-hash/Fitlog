services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitlog
      POSTGRES_PASSWORD: fitlog
      POSTGRES_DB: fitlog
    ports:
      - '5432:5432'
    volumes:
      - fitlog-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitlog']
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fitlog:fitlog@db:5432/fitlog
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  fitlog-data:
